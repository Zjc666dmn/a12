[project]
name = "edu-rag-api"
version = "0.1.0"
description = "Local education knowledge base RAG infrastructure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "rank-bm25>=0.2.2",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "aiofiles>=25.1.0",
  "python-dotenv>=1.2.3",
  "aiosqlite>=0.22.1",
  "greenlet>=3.5.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/api"]
testpaths = ["tests"]
